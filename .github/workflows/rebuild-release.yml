name: Rebuild release dmg

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to rebuild (empty — the latest one)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  rebuild:
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Target release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName -q .tagName)
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Release \"$tag\" not found" >&2
            exit 1
          fi

          asset=$(gh release view "$tag" --json assets -q '.assets[].name' \
                  | grep -i '\.dmg$' | head -1)
          if [ -z "$asset" ]; then
            asset="System-Spinner-$tag.dmg"
            echo "No dmg in \"$tag\" — the rebuilt one will be added as $asset"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "Rebuilding $asset in release $tag from ${GITHUB_SHA:0:7}"

      - name: Build and export the app
        run: |
          xcodebuild -project "System Spinner.xcodeproj" \
                     -scheme "System Spinner" \
                     -configuration Release \
                     -archivePath "build/System Spinner.xcarchive" \
                     archive

          xcodebuild -exportArchive \
                     -archivePath "build/System Spinner.xcarchive" \
                     -exportPath build \
                     -exportOptionsPlist ExportOptions.plist

      - name: Package dmg
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true

          brew list graphicsmagick >/dev/null 2>&1 || brew install graphicsmagick
          brew list imagemagick >/dev/null 2>&1 || brew install imagemagick

          cd build
          npx --yes create-dmg "System Spinner.app" . --overwrite --no-code-sign

          built=$(ls -t *.dmg | head -1)
          mv "$built" "../$ASSET"

      - name: Package the diagnostic tools
        run: |
          swiftc -O -o Scripts/system-probe Scripts/system-probe.swift

          cd Scripts
          zip -j ../system-diagnostic.zip system-probe run-probe.sh system-probe.swift

      - name: Replace the assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          gh release upload "$TAG" "$ASSET" system-diagnostic.zip --clobber

      - name: Repoint the list of changes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          gh release view "$TAG" --json body -q .body > body.md
          awk '
            $0 == "## What'\''s Changed" { exit }
            /^\*\*Full list of changes\*\*:/ { exit }
            { print }
          ' body.md | awk '
            /^[[:space:]]*$/ { blank = blank $0 "\n"; next }
            { if (started) printf "%s", blank; blank = ""; started = 1; print }
          ' > notes.md

          sha=$(git rev-parse --short HEAD)
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "$TAG")

          if [ -s notes.md ]; then echo >> notes.md; fi
          echo "**Full list of changes**: $REPO_URL/compare/$previous...$sha" >> notes.md

          gh release edit "$TAG" --notes-file notes.md
