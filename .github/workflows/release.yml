name: Release

# A release is published when MARKETING_VERSION is raised in the project.
# The workflow only runs for commits touching the project file, where that
# version lives, and publishes only when the version is actually higher.
# Tests come from the Test workflow: failing tests stop the job here too, so a
# broken build never gets published.
on:
  push:
    branches: [main]
    paths:
      - 'System Spinner.xcodeproj/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep macosx || true

      - name: Project version and latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # MARKETING_VERSION lives on the app target. Asking the target lets
          # xcodebuild resolve it — a plain grep over the project file would
          # depend on its layout.
          version=$(xcodebuild -project "System Spinner.xcodeproj" \
                               -target "System Spinner" \
                               -configuration Release \
                               -showBuildSettings 2>/dev/null \
                    | awk '$1 == "MARKETING_VERSION" { print $3; exit }')

          if [ -z "$version" ]; then
            echo "MARKETING_VERSION for the \"System Spinner\" target not found" >&2
            exit 1
          fi

          # Empty rather than 0.0.0 when nothing is published yet: the notes below
          # tell "no previous release" from "a release numbered 0.0.0".
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "Project: $version, latest release: ${latest:-none}"

          # publish only when the version is strictly greater than the released one
          released="${latest:-0.0.0}"
          highest=$(printf '%s\n%s\n' "$released" "$version" | sort -V | tail -1)
          if [ "$version" != "$released" ] && [ "$highest" = "$version" ]; then
            echo "release=yes" >> "$GITHUB_OUTPUT"
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "Version was not raised — skipping publication"
          fi

      - name: Build and export the app
        run: |
          xcodebuild -project "System Spinner.xcodeproj" \
                     -scheme "System Spinner" \
                     -configuration Release \
                     -archivePath "build/System Spinner.xcarchive" \
                     archive

          xcodebuild -exportArchive \
                     -archivePath "build/System Spinner.xcarchive" \
                     -exportPath build \
                     -exportOptionsPlist ExportOptions.plist

      - name: Package dmg
        if: steps.version.outputs.release == 'yes'
        run: |
          version="${{ steps.version.outputs.version }}"

          # The runner image comes with an aws/tap that Homebrew no longer
          # trusts by default, and every brew call below would print a page
          # about it. Nothing here uses that tap, and the runner is thrown
          # away afterwards, so it goes rather than being silenced with
          # HOMEBREW_NO_REQUIRE_TAP_TRUST — which Homebrew says it is about to
          # remove.
          brew untap aws/tap >/dev/null 2>&1 || true

          # create-dmg renders the window background and icon layout
          brew list graphicsmagick >/dev/null 2>&1 || brew install graphicsmagick
          brew list imagemagick >/dev/null 2>&1 || brew install imagemagick

          cd build
          npx --yes create-dmg "System Spinner.app" . --overwrite --no-code-sign

          # create-dmg names the file after the app and its version
          mv "System Spinner $version.dmg" "../System-Spinner-$version.dmg"

      - name: Package the diagnostic tools
        if: steps.version.outputs.release == 'yes'
        run: |
          # Built here rather than taken from the repository, so the binary in a
          # release comes from the same checkout as the app beside it.
          swiftc -O -o Scripts/system-probe Scripts/system-probe.swift

          # Flat on purpose: the launcher looks for the probe next to itself.
          # The source goes along because the binary is unsigned, and anyone
          # asked to run one of those should be able to see what it does and
          # build it again.
          cd Scripts
          zip -j ../system-diagnostic.zip system-probe run-probe.sh system-probe.swift

      - name: Release notes
        if: steps.version.outputs.release == 'yes'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # section for this version from Changelog.md, without the blank lines
          # that separate it from the next one; empty when there is no section
          awk -v v="## $VERSION" '
            $0 == v { found = 1; next }
            /^## / { found = 0 }
            found { print }
          ' Changelog.md | awk '
            /^[[:space:]]*$/ { blank = blank $0 "\n"; next }
            { if (started) printf "%s", blank; blank = ""; started = 1; print }
          ' > notes.md

          if [ ! -s notes.md ]; then
            echo "No \"## $VERSION\" section in Changelog.md — the notes will be the link alone"
          fi

          # A link instead of a list of commits: GitHub renders it as
          # "<previous tag>...<tag>", and the tag resolves once the release is
          # created below. A first release has nothing to compare against.
          if [ -n "$PREVIOUS" ]; then
            if [ -s notes.md ]; then echo >> notes.md; fi
            echo "**Full list of changes**: $REPO_URL/compare/$PREVIOUS...$VERSION" >> notes.md
          fi

      - name: Publish
        if: steps.version.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$version" "System-Spinner-$version.dmg" system-diagnostic.zip \
             --title "Version $version" \
             --notes-file notes.md
